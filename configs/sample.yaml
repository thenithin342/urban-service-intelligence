# Small reproducible sample for development, CI and dashboard demo.
dataset_id: erm2-nwe9
base_url: https://data.cityofnewyork.us/resource/erm2-nwe9.json
metadata_url: https://data.cityofnewyork.us/api/views/erm2-nwe9
columns_metadata_url: https://data.cityofnewyork.us/api/views/erm2-nwe9/columns.json
fields:
  - unique_key
  - created_date
  - closed_date
  - complaint_type
  - descriptor
  - agency
  - status
  - borough
  - incident_zip
  - latitude
  - longitude
# Fixed historical window (January 2024) so re-downloads are stable.
where: "created_date between '2024-01-01T00:00:00' and '2024-01-31T23:59:59'"
order: unique_key
target_rows: 100000
# 50k pages: per-request server latency (~20s for ordered window scan)
# dominates, so fewer large pages are much faster than many small ones.
page_size: 50000
timeout_seconds: 180
max_retries: 6
backoff_base_seconds: 1.0
seed: 42
out_raw: data/raw/nyc311_sample.csv
out_manifest: data/manifests/manifest_sample.json
eda_outdir: artifacts/eda_sample
# Phase 2 ETL outputs (gitignored processed data).
input_csv: data/raw/nyc311_sample.csv
etl_output: data/processed/nyc311_clean
etl_quality_report: data/processed/etl_quality.json
