# Small reproducible sample for development, CI and dashboard demo.
dataset_id: erm2-nwe9
base_url: https://data.cityofnewyork.us/resource/erm2-nwe9.json
metadata_url: https://data.cityofnewyork.us/api/views/erm2-nwe9
columns_metadata_url: https://data.cityofnewyork.us/api/views/erm2-nwe9/columns.json
fields:
  - unique_key
  - created_date
  - closed_date
  - complaint_type
  - descriptor
  - agency
  - status
  - borough
  - incident_zip
  - latitude
  - longitude
# Fixed historical window (January 2024) so re-downloads are stable.
where: "created_date between '2024-01-01T00:00:00' and '2024-01-31T23:59:59'"
order: unique_key
target_rows: 100000
# 50k pages: per-request server latency (~20s for ordered window scan)
# dominates, so fewer large pages are much faster than many small ones.
page_size: 50000
timeout_seconds: 180
max_retries: 6
backoff_base_seconds: 1.0
seed: 42
out_raw: data/raw/nyc311_sample.csv
out_manifest: data/manifests/manifest_sample.json
eda_outdir: artifacts/eda_sample
# Phase 2 ETL outputs (gitignored processed data).
input_csv: data/raw/nyc311_sample.csv
etl_output: data/processed/nyc311_clean
etl_quality_report: data/processed/etl_quality.json

# Member 1 Phase 3 analytics (src/analytics, scripts/run_member1_analytics.py).
# Outputs are gitignored; the artifact contract is documented in
# docs/member1/artifact_contract.md. Bounds below are driver-collection
# guards, not sampling of source records.
member1:
  analytics_outdir: artifacts/member1/analytics
  top_categories: 20
  grid_cell_deg: 0.01          # deterministic lat/lon grid cell (~1.1 km lat)
  hotspot_min_count: 50        # min complaints per grid cell to report
  kmeans_k_values: [2, 3, 4, 5, 6, 8]
  kmeans_seed: 42
  # Primary feature variant (justified: comparable scales). Ablation still
  # reports log_count_unscaled and count_scaled for comparison.
  kmeans_variant: log_count_scaled
  dbscan_eps_meters: 250
  dbscan_eps_grid: [100, 250, 500, 1000]   # parameter-sensitivity sweep
  dbscan_min_pts: 25
  dbscan_sample_cap: 20000     # bounded sample for single-node DBSCAN
  dbscan_seed: 42
  max_collect_rows: 20000      # bounded driver collection guard for tables

# Member 3 advisory priority scoring + backtest (src/prioritization,
# scripts/run_member3_priorities.py; formula in docs/member3/priority_scoring.md).
# The score is an advisory operational priority, not a staffing optimum.
member3:
  input: data/processed/nyc311_clean   # or data/processed/member1_history (--input)
  location_type: borough               # borough | zip
  window_days: 7                       # scoring / target window length (days)
  step_days: 7                         # backtest window step (days)
  weights:                             # non-negative, must sum to 1
    demand: 0.5
    backlog: 0.3
    delay: 0.2
  min_delay_records: 5                 # delay is null below this many resolved records
  delay_lookback_days: null            # null = all resolved history before the cut-off
  backtest_k: [10, 25, 50]
  random_seed: 42                      # random-ranking baseline
  partial_day_ratio: 0.5               # drop trailing days below 0.5 x median volume
  lag_cap_days: 60                     # close-lag clip; must be >= window_days
  scoring_version: member3-priority-v1
  spark_master: local[2]

# Member 2 mining / closure modeling / evaluation (src/mining, src/modeling/
# resolution.py, src/evaluation, scripts/run_member2_*.py). Outputs are
# gitignored under artifacts/member2 at the paths in docs/data_contracts.md.
# Semantics: docs/member2/semantics.md.
member2:
  outdir: artifacts/member2
  basket_granularity: week       # (incident_zip, created_week) baskets
  drop_partial_weeks: false      # sample week of 2024-01-08 has 5 days
  min_support: 0.6
  min_confidence: 0.8
  support_grid: [0.5, 0.6, 0.7, 0.8]
  confidence_grid: [0.5, 0.7, 0.9]
  secondary_granularity: day     # (incident_zip, created_day) sensitivity
  secondary_support_grid: [0.1, 0.2, 0.3, 0.4]
  secondary_min_support: 0.2
  secondary_min_confidence: 0.8
  closure_horizon_days: 7
  train_cutoff: '2024-01-09'     # test = created_day 2024-01-09..2024-01-12
  validation_days: 2             # train tail 2024-01-07..08 for model selection
  label_embargo_days: 0          # sample too short for an embargo (see results)
  top_categories: 40
  smoothing_alpha: 20.0
  min_cohort_n: 30
  seed: 42
