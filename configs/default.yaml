# Default (full-scale) configuration. Values are advisory until verified.
dataset_id: erm2-nwe9
base_url: https://data.cityofnewyork.us/resource/erm2-nwe9.json
metadata_url: https://data.cityofnewyork.us/api/views/erm2-nwe9
columns_metadata_url: https://data.cityofnewyork.us/api/views/erm2-nwe9/columns.json
fields:
  - unique_key
  - created_date
  - closed_date
  - complaint_type
  - descriptor
  - agency
  - status
  - borough
  - incident_zip
  - latitude
  - longitude
# Fixed historical window for reproducibility. Adjust after verifying coverage.
where: "created_date between '2024-01-01T00:00:00' and '2024-03-31T23:59:59'"
order: unique_key
target_rows: 500000
page_size: 50000
timeout_seconds: 180
max_retries: 6
backoff_base_seconds: 1.0
seed: 42
out_raw: data/raw/nyc311_default.csv
out_manifest: data/manifests/manifest_default.json
eda_outdir: artifacts/eda_default
# Phase 2 ETL outputs (gitignored processed data).
input_csv: data/raw/nyc311_default.csv
etl_output: data/processed/nyc311_clean_default
etl_quality_report: data/processed/etl_quality_default.json

# Member 1 Phase 3 analytics (see configs/sample.yaml for key semantics).
member1:
  analytics_outdir: artifacts/member1/analytics_default
  top_categories: 25
  grid_cell_deg: 0.01
  projection_epsg: 32618
  hotspot_min_count: 100
  kmeans_k_values: [2, 3, 4, 5, 6, 8, 10]
  kmeans_seed: 42
  kmeans_variant: log_count_scaled
  dbscan_eps_meters: 250
  dbscan_eps_grid: [100, 250, 500, 1000]
  dbscan_min_pts: 25
  dbscan_sample_cap: 50000
  dbscan_seed: 42
  max_collect_rows: 50000
